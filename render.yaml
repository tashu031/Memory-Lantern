services:
  # FastAPI Backend Web Service
  - type: web
    name: memory-lantern-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: gemma2:2b
      - key: CORS_ORIGINS
        value: https://*.onrender.com,http://localhost:5173,http://127.0.0.1:5173
    healthCheckPath: /health

  # React + Vite Frontend Static Site
  - type: web
    name: memory-lantern-frontend
    env: static
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
